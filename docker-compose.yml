version: "3.9"

# Full development environment for Scrum Ceremony Platform
# Usage: docker compose up -d

services:
  # ============================================
  # PostgreSQL + pgvector
  # ============================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scp-postgres
    environment:
      POSTGRES_USER: scp_user
      POSTGRES_PASSWORD: scp_dev_password
      POSTGRES_DB: scp_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scp_user -d scp_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scp-network

  # ============================================
  # Redis (sessions, presence, voter tokens, DLQ)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: scp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scp-network

  # ============================================
  # Backend API (FastAPI)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scp-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://scp_user:scp_dev_password@postgres:5432/scp_platform
      REDIS_URL: redis://redis:***@postgres:5432/scp_platform
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scp-network
    restart: unless-stopped

  # ============================================
  # Frontend (Next.js)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scp-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - scp-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  scp-network:
    driver: bridge
